<div class="footer__feedback">
  <form class="footer__feedback-form">
    <label class="footer__feedback-label">
      Подпишись и будь в курсе происходящего
    </label>

    <span class="footer__feedback-field">
      <input
        class="footer__feedback-input"
        type="email"
        placeholder="Email"
      />
      <button class="footer__feedback-btn">Подписаться</button>
    </span>

    <span class="footer__feedback-agreement">
      <input class="footer__feedback-checkbox" type="checkbox" />
      <p class="footer__feedback-text">
        Согласен на обработку персональных данных
      </p>
    </span>
  </form>

  <div class="footer__brand">
    <span class="footer__brand-title">Создание и продвижение</span>
    <img
      class="footer__brand-image"
      src="images/dignity-codes.png"
      alt="Dignity Codes"
    />
  </div>
</div>
