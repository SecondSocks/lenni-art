<article class="blog__card">
  <img class="blog__card-image" src="@@image" alt="@@alt" />

  <div class="blog__card-content">
    <time class="blog__card-date" datetime="@@datetime">@@date</time>
    <a class="blog__card-title" href="@@link">
      <h4 class="blog__card-title-text">@@title</h4>
    </a>
    <div class="blog__card-body">
      <p class="blog__card-description">@@description</p>
      <a class="blog__card-btn" href="@@link" aria-label="Читать статью">
        <img
          class="blog__card-btn-icon"
          src="images/right-arrow.png"
          alt=""
        />
      </a>
    </div>
  </div>
</article>
